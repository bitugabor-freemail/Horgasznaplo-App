name: horgasznaplo
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  geolocator: ^11.0.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/2825.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/2825.png"
  adaptive_icon_background: "#161616"
  adaptive_icon_foreground: "assets/2825.png"
